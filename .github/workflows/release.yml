name: Build release
on:
  push: {tags: ["v*.*.*"]}
permissions: {contents: write}
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - shell: pwsh
        run: |
          $v='${{ github.ref_name }}'.TrimStart('v')
          ./scripts/Build-Release.ps1 -Version $v
      - shell: pwsh
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "${{ github.ref_name }}" "out/Allium-${{ github.ref_name }}.zip" "out/SHA256SUMS.txt" --verify-tag --generate-notes
